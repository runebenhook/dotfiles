source = $HOME/.config/hypr/hyprlock-colors.conf

$font = JetBrainsMono Nerd Font


# ─────────────────────────────────────────────
# GENERAL
# ─────────────────────────────────────────────

general {
    hide_cursor = true
    disable_loading_bar = true
    text_trim = true
    no_fade_in = false
    no_fade_out = false
}


# ─────────────────────────────────────────────
# BACKGROUND
# ─────────────────────────────────────────────

background {
    monitor =

    path = $HOME/.config/hypr/hyprlock-wallpaper

    blur_passes = 2
    blur_size = 7

    brightness = 0.65
    contrast = 1.05
    vibrancy = 0.08
    vibrancy_darkness = 0.0
}


# ─────────────────────────────────────────────
# HORA
# ─────────────────────────────────────────────

label {
    monitor =

    text = $TIME

    color = $fg

    font_size = 96
    font_family = $font

    position = 0, -75

    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgb(000000)
}


# ─────────────────────────────────────────────
# USUARIO
# ─────────────────────────────────────────────

label {
    monitor =

    text = rune

    color = $accent

    font_size = 19
    font_family = $font

    position = 0, 20

    halign = center
    valign = center
}


# ─────────────────────────────────────────────
# FECHA
# ─────────────────────────────────────────────

label {
    monitor =

    text = cmd[update:60000] date +"%A, %d de %B"

    color = $muted

    font_size = 14
    font_family = $font

    position = 0, 50

    halign = center
    valign = center
}


# ─────────────────────────────────────────────
# CONTRASEÑA
# ─────────────────────────────────────────────

input-field {
    monitor =

    size = 280, 52

    outline_thickness = 2

    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true

    outer_color = $accent
    inner_color = $surface

    font_color = $fg

    fade_on_empty = true

    placeholder_text = <i>Contraseña...</i>

    check_color = $success
    fail_color = $error

    fail_text = <i>$FAIL</i>

    position = 0, 125

    halign = center
    valign = center

    rounding = 14
}


# ─────────────────────────────────────────────
# CPU / RAM / BATERÍA
# ─────────────────────────────────────────────

label {
    monitor =

    text = cmd[update:3000] $HOME/.config/hypr/scripts/hyprlock-stats.sh

    color = $muted

    font_size = 12
    font_family = $font

    position = 0, 35

    halign = center
    valign = bottom
}


# ─────────────────────────────────────────────
# REPRODUCTOR
# ─────────────────────────────────────────────

label {
    monitor =

    text = cmd[update:2000] $HOME/.config/hypr/scripts/hyprlock-music.sh

    color = $fg

    font_size = 12
    font_family = $font

    position = 0, 72

    halign = center
    valign = bottom
}
